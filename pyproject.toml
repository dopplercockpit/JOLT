[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jolt-tokens"
version = "0.2.0"
description = "JOLT (JSON-Optimized Lightweight Tokens)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Doppler/Edward" }
]

dependencies = [
  # core deps here if you add any later (currently none strictly required)
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[project.scripts]
jolt = "jolt.cli:main"
