[project]
name = "jolt-tokens"
version = "0.1.0"
description = "JOLT - JSON-Optimized Lightweight Tokens"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/dopplercockpit/JOLT"

[project.scripts]
jolt = "jolt.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
